services:
  backend:
    build: ./backend
    container_name: advaih-backend
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: advaih-frontend
    ports:
      - "4200:80"
    restart: unless-stopped