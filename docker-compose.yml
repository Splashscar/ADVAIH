services:
  backend:
    build: ./backend
    container_name: advaih-backend
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: advaih-frontend
    ports:
      - "4200:80"
    restart: unless-stopped

    nginx-proxy-manager:
      image: jc21/nginx-proxy-manager:latest
      container_name: nginx-proxy-manager
      ports:
        - "80:80"
        - "81:81"
        - "443:443"
      volumes:
        - ./nginx-data:/data
        - ./nginx-letsencrypt:/etc/letsencrypt
      restart: unless-stopped