<div class="home-container">

    <app-navbar></app-navbar>

    <header class="hero">

        <h1>
            <svg class="icon-favorito" width="24" height="24"
                 viewBox="0 0 24 24"
                 fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06
                         a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84
                         a5.5 5.5 0 0 0 0-7.78Z"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>

            Mis Favoritos
        </h1>

        <p>Eventos que has guardado.</p>

    </header>

    <section class="eventos-section">

        @if (favoritos.length > 0) {

            <div class="eventos-grid">

                @for (evento of favoritos; track $index) {

                    <div class="evento-card">

                        <img [src]="evento.imageUrl">

                        <div class="evento-info">

                            <h3>{{evento.title}}</h3>

                            <p>{{evento.location}}</p>

                        </div>

                    </div>

                }

            </div>

        } @else {

            <div class="sin-favoritos">

                <svg class="icon-favorito" width="28" height="28"
                     viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06
                             a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84
                             a5.5 5.5 0 0 0 0-7.78Z"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>

                <span>No tienes eventos favoritos.</span>

            </div>

        }

    </section>

</div>
