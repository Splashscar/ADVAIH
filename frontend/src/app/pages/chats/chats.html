<app-navbar></app-navbar>

<div class="chat-container">

  <div class="chat-header">
    <div>
      <h1>Chats</h1>
      <p>Busca una persona para iniciar una conversación</p>
    </div>
  </div>

  <!-- BUSCADOR -->
  <div class="buscador-container">

    <span class="buscador-icono">🔍</span>

    <input
      type="text"
      [(ngModel)]="filtro"
      placeholder="Buscar por nombre o correo..."
    >

    <button
      *ngIf="filtro"
      class="btn-limpiar"
      (click)="filtro = ''">

      ✕

    </button>

  </div>


  <!-- RESULTADOS -->

  <div class="lista-usuarios">

    <div
      class="usuario-card"
      *ngFor="let usuario of usuariosFiltrados">

      <!-- FOTO -->
      <img
        [src]="
          usuario.fotoURL ||
          'https://static.vecteezy.com/system/resources/previews/018/765/757/non_2x/user-profile-icon-in-flat-style-member-avatar-illustration-on-isolated-background-human-permission-sign-business-concept-vector.jpg'
        "
        alt="Foto de perfil"
        class="usuario-foto"
      >


      <!-- INFORMACIÓN -->
      <div class="info">

        <h3>
          {{ usuario.nombre || 'Usuario' }}
        </h3>

        <p>
          {{ usuario.email }}
        </p>

      </div>


      <!-- BOTÓN -->
      <button
        class="btn-mensaje"
        (click)="crearChat(usuario)">

        <span>💬</span>

        <span>Mensaje</span>

      </button>

    </div>


    <!-- SIN RESULTADOS -->

    <div
      class="sin-resultados"
      *ngIf="usuariosFiltrados.length === 0">

      <div class="sin-resultados-icono">
        🔎
      </div>

      <h3>No encontramos usuarios</h3>

      <p>
        Intenta buscar con otro nombre o correo.
      </p>

    </div>

  </div>
  
  <app-footer></app-footer>

</div>
