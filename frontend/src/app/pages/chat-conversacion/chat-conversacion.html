<app-navbar></app-navbar>

<div class="chat-container">

  <div class="chat-header">

    <button class="btn-volver" (click)="volver()" title="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>

    <img
      [src]="usuarioDestino?.fotoURL || 'https://static.vecteezy.com/system/resources/previews/018/765/757/non_2x/user-profile-icon-in-flat-style-member-avatar-illustration-on-isolated-background-human-permission-sign-business-concept-vector.jpg'">

    <div>

      <h3>{{ usuarioDestino?.nombre }}</h3>

      <p>{{ usuarioDestino?.email }}</p>

    </div>

  </div>

  <div class="chat-messages" #scrollContainer>

    <div
      *ngFor="let mensaje of mensajes"
      [class.mensaje-propio]="mensaje.emisor === usuarioActual?.uid"
      [class.mensaje-ajeno]="mensaje.emisor !== usuarioActual?.uid">

      {{ mensaje.texto }}

    </div>

  </div>

  <div class="chat-input">

    <input
      type="text"
      [(ngModel)]="mensaje"
      placeholder="Escribe un mensaje..."
      (keydown.enter)="enviar()">

    <button
      (click)="enviar()">
      Enviar
    </button>

  </div>

</div>
