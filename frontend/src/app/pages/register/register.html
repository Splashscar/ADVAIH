<div class="register-container">

    <div class="left-panel">

        <h1>ADVAIH</h1>

        <h2>
            Publica tus eventos y llega
            a miles de personas.
        </h2>

    </div>


    <div class="right-panel">

        <div class="header">

            <span>
                ¿Ya tienes cuenta?
            </span>

            <a routerLink="/">
                Inicia sesión
            </a>

        </div>


        <h1>
            Crea tu cuenta
        </h1>

        <p>
            Comparte tus eventos y haz crecer tu comunidad.
        </p>


        <div class="grid">

            <input type="text" placeholder="Nombre completo" [(ngModel)]="nombre">


            <input type="email" placeholder="Correo electrónico" [(ngModel)]="email">



            
            <div class="password-container">

                <input [type]="mostrarPassword ? 'text' : 'password'" placeholder="Contraseña" [(ngModel)]="password">

                <span class="ojo-password" (click)="mostrarPassword = !mostrarPassword">

                    {{ mostrarPassword ? '🙈' : '👁️' }}

                </span>

            </div>


            <div class="password-container">

                <input [type]="mostrarConfirmarPassword ? 'text' : 'password'" placeholder="Confirmar contraseña"
                    [(ngModel)]="confirmarPassword">

                <span class="ojo-password" (click)="mostrarConfirmarPassword = !mostrarConfirmarPassword">

                    {{ mostrarConfirmarPassword ? '🙈' : '👁️' }}

                </span>

            </div>
         




        </div>


        <!-- ========================= -->
        <!-- SELECCIÓN DE ROL -->
        <!-- ========================= -->

        <div class="tipo-usuario">

            <h3>
                ¿Cómo quieres utilizar ADVAIH?
            </h3>


            <label>

                <input type="radio" name="tipo_usuario" value="usuario" [(ngModel)]="tipo_usuario">

                👤 Usuario

            </label>


            <label>

                <input type="radio" name="tipo_usuario" value="organizador" [(ngModel)]="tipo_usuario">

                🤝 Colaborador

            </label>

        </div>


        <!-- ========================= -->
        <!-- DESCRIPCIÓN COLABORADOR -->
        <!-- ========================= -->

        <textarea *ngIf="tipo_usuario === 'organizador'" placeholder="Descripción de tu organización"
            [(ngModel)]="descripcion">
        </textarea>


        <button type="button" (click)="registrar()">

            Crear cuenta

        </button>

    </div>

</div>
